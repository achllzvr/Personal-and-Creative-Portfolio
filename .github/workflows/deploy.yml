name: Build check (Hostinger deploys production)

# Production deployment is handled by Hostinger's native Node/Vite
# deployment for avrabina.com (hPanel -> Deployments, branch: main).
# It builds on every push with:
#   Root directory:  .            <-- repo root, NOT "public"
#   Build command:   npm run build
#   Output directory: dist
#   Node version:    22.x
# This workflow is only a pre-flight check that the commit builds
# cleanly. It does NOT upload anything, so it can't conflict with
# Hostinger's own deploy (no FTP secrets needed).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FORMSPREE_ENDPOINT: ${{ secrets.VITE_FORMSPREE_ENDPOINT }}
